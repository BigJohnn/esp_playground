substitutions:
  name: korvo-demo
  friendly_name: Korvo Demo
  timezone: Asia/Shanghai

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: "Feature-rich demo for ESP32-S3-Korvo-1.1: voice assistant, media, recording, SD, LEDs, HA"
  name_add_mac_suffix: true
  project:
    name: esp_playground.korvo_demo
    version: "1.1.0"

external_components:
  - source:
      type: local
      path: custom_components

esp32:
  cpu_frequency: 240MHz
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ: "240"
      CONFIG_FREERTOS_UNICORE: n
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "32768"
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_SPIRAM_SUPPORT: y

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  services:
    - service: korvo_diag
      then:
        - lambda: |-
            id(korvo_hw).dump_es8311_diag();
    - service: korvo_set_bclk_invert
      variables:
        invert: bool
      then:
        - lambda: |-
            id(korvo_hw).set_dac_sclk_inverted(invert);

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.1.42
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 192.168.1.1
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_fallback_password

web_server:
  port: 80
  auth:
    username: !secret web_user
    password: !secret web_password

captive_portal:

time:
  - platform: homeassistant
    id: ha_time

# On-board SD card via 1-bit SDMMC
sd_card:
  id: korvo_sd
  clk_pin: 18
  cmd_pin: 17
  d0_pin: 16
  width: 1
  mount_point: /sdcard
  max_files: 3
  format_if_mount_failed: true
  allocation_unit_kb: 16
  power_pin: -1
  power_active_low: false
  power_on_delay_ms: 100
  frequency_khz: 12000

globals:
  - id: korvo_mode_idx
    type: int
    restore_value: yes
    initial_value: "0"
  - id: korvo_buttons_last
    type: int
    restore_value: no
    initial_value: "-1"

script:
  - id: ha_call_vol_up
    then:
      - homeassistant.service:
          service: media_player.volume_up
          data:
            entity_id: media_player.korvo_media
  - id: ha_call_vol_down
    then:
      - homeassistant.service:
          service: media_player.volume_down
          data:
            entity_id: media_player.korvo_media
  - id: ha_call_play_pause
    then:
      - homeassistant.service:
          service: media_player.media_play_pause
          data:
            entity_id: media_player.korvo_media
  - id: ha_call_stop
    then:
      - homeassistant.service:
          service: media_player.media_stop
          data:
            entity_id: media_player.korvo_media
  - id: ha_mode_cycle
    then:
      - lambda: |-
          int m = id(korvo_mode_idx);
          m = (m + 1) % 2;  // 0: low-latency, 1: stable
          id(korvo_mode_idx) = m;
      - if:
          condition:
            lambda: 'return id(korvo_mode_idx) == 0;'
          then:
            - light.addressable_set:
                id: korvo_ring
                range_from: 0
                range_to: 11
                red: 0%
                green: 0%
                blue: 100%
            - homeassistant.event:
                event: esphome.korvo_profile
                data:
                  profile: low_latency
          else:
            - light.addressable_set:
                id: korvo_ring
                range_from: 0
                range_to: 11
                red: 0%
                green: 100%
                blue: 0%
            - homeassistant.event:
                event: esphome.korvo_profile
                data:
                  profile: stable
  - id: ha_evt_btn_mode
    then:
      - homeassistant.event:
          event: esphome.korvo_button
          data:
            key: MODE
  - id: ha_evt_btn_play
    then:
      - homeassistant.event:
          event: esphome.korvo_button
          data:
            key: PLAY
  - id: ha_evt_btn_set
    then:
      - homeassistant.event:
          event: esphome.korvo_button
          data:
            key: SET

# time:
#   - platform: homeassistant
#     id: ha_time

# Korvo-1.1 audio front-end (ES8311 + ES7210)
korvo_audio:
  id: korvo_hw
  sda: 1
  scl: 2
  i2c_frequency: 400000
  pa_pin: 38
  speaker_sample_rate: 22050
  speaker_volume: 85
  mic_sample_rate: 16000
  mic_mclk_ratio: 256
  mic_gain: 24DB
  mic_bias: 2V87
  mic_tdm: true

i2s_audio:
  - id: korvo_speaker_bus
    i2s_mclk_pin: GPIO42
    i2s_bclk_pin: GPIO40
    i2s_lrclk_pin: GPIO41
  - id: korvo_mic_bus
    i2s_mclk_pin: GPIO20
    i2s_bclk_pin: GPIO10
    i2s_lrclk_pin: GPIO9

microphone:
  - platform: korvo_tdm_mic
    id: korvo_mic

speaker:
  - platform: i2s_audio
    id: korvo_speaker
    i2s_audio_id: korvo_speaker_bus
    i2s_dout_pin: GPIO39
    dac_type: external
    bits_per_sample: 16bit
    sample_rate: 22050
    timeout: 800ms

  - platform: mixer
    id: korvo_mixer
    output_speaker: korvo_speaker
    source_speakers:
      - id: announcement_spk_mixer_input
        buffer_duration: 350ms
        timeout: 2s
      - id: media_spk_mixer_input
        buffer_duration: 200ms
        timeout: 2s

  - platform: resampler
    id: media_spk_resampling_input
    output_speaker: media_spk_mixer_input
    buffer_duration: 300ms
    num_channels: 1
    bits_per_sample: 16
    sample_rate: 22050
    filters: 32
    taps: 32

  - platform: resampler
    id: announcement_spk_resampling_input
    output_speaker: announcement_spk_mixer_input
    bits_per_sample: 16
    sample_rate: 22050
    filters: 32
    taps: 32
    num_channels: 1
    buffer_duration: 400ms

sensor:
  - platform: adc
    id: korvo_buttons_adc
    pin: GPIO8
    attenuation: 12db
    update_interval: 20ms
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
    on_value:
      then:
        - lambda: |-
            const float mv = id(korvo_buttons_adc).state * 1000.0f;
            auto in = [&](float v, float lo, float hi){ return v >= lo && v <= hi; };
            int key = -1;
            if      (in(mv, 2310, 2510)) key = 0;  // REC/PTT
            else if (in(mv, 1880, 2080)) key = 1;  // MODE
            else if (in(mv, 1560, 1760)) key = 2;  // PLAY
            else if (in(mv, 1010, 1210)) key = 3;  // SET
            else if (in(mv,  720,  920)) key = 4;  // VOLDOWN
            else if (in(mv,  280,  480)) key = 5;  // VOLUP
            if (key >= 0 && key != id(korvo_buttons_last)) {
              id(korvo_buttons_last) = key;
              switch (key) {
                case 0:
                  id(korvo_ptt).press();
                  break;
                case 4:
                  id(ha_call_vol_down).execute();
                  break;
                case 5:
                  id(ha_call_vol_up).execute();
                  break;
                case 1:
                  id(ha_mode_cycle).execute();
                  id(ha_evt_btn_mode).execute();
                  break;
                case 2:
                  id(ha_call_play_pause).execute();
                  id(ha_evt_btn_play).execute();
                  break;
                case 3:
                  id(ha_call_stop).execute();
                  id(ha_evt_btn_set).execute();
                  break;
              }
            }

  - platform: wifi_signal
    name: "${friendly_name} WiFi RSSI"
    id: wifi_rssi
    update_interval: 30s

  - platform: uptime
    name: "${friendly_name} Uptime"
    id: uptime_s
    update_interval: 60s

text_sensor:
  - platform: version
    name: "${friendly_name} ESPHome Version"
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP"
    ssid:
      name: "${friendly_name} SSID"
    bssid:
      name: "${friendly_name} BSSID"
    mac_address:
      name: "${friendly_name} MAC"
  - platform: template
    name: "${friendly_name} Uptime (Human)"
    id: uptime_human
    icon: mdi:clock-start
    lambda: |-
      uint32_t seconds = (uint32_t) id(uptime_s).state;
      char buffer[32];
      uint32_t days = seconds / 86400;
      seconds %= 86400;
      uint8_t hours = seconds / 3600;
      seconds %= 3600;
      uint8_t minutes = seconds / 60;
      uint8_t secs = seconds % 60;
      if (days) {
        sprintf(buffer, "%ud %02u:%02u:%02u", days, hours, minutes, secs);
      } else {
        sprintf(buffer, "%02u:%02u:%02u", hours, minutes, secs);
      }
      return std::string(buffer);

button:
  - platform: template
    name: "SD Write Test"
    on_press:
      - logger.log: "[SD] Write test start"
      - lambda: |-
          if (!id(korvo_sd).is_mounted()) {
            ESP_LOGW("sdtest", "SD not mounted yet - triggering remount and delaying 300ms");
            id(korvo_sd).setup();
            esphome::delay(300);
          }
      - lambda: |-
          FILE *f = fopen("/sdcard/test.txt", "w");
          if (!f) {
            ESP_LOGE("sdtest", "open failed - SD not mounted? errno=%d", (int)errno);
          } else {
            const char *msg = "hello from esphome";
            fwrite(msg, 1, strlen(msg), f);
            fflush(f);
            ::fsync(::fileno(f));
            fclose(f);
            ESP_LOGI("sdtest", "write ok");
          }
  - platform: template
    name: "SD Read Test"
    on_press:
      - logger.log: "[SD] Read test start"
      - lambda: |-
          if (!id(korvo_sd).is_mounted()) {
            ESP_LOGW("sdtest", "SD not mounted yet - triggering remount and delaying 300ms");
            id(korvo_sd).setup();
            esphome::delay(300);
          }
      - lambda: |-
          FILE *f = fopen("/sdcard/test.txt", "r");
          if (!f) {
            ESP_LOGE("sdtest", "open failed - file missing or SD not mounted (errno=%d)", (int)errno);
          } else {
            char buf[64] = {0};
            size_t n = fread(buf, 1, sizeof(buf)-1, f);
            fclose(f);
            ESP_LOGI("sdtest", "read %u bytes: %s", (unsigned)n, buf);
          }
  - platform: template
    name: "SD Remount"
    on_press:
      - logger.log: "[SD] Remount requested"
      - lambda: |-
          id(korvo_sd).unmount();
          esphome::delay(200);
          id(korvo_sd).setup();

  - platform: template
    name: "Speaker Beep Test"
    on_press:
      - speaker.play:
          id: announcement_spk_mixer_input
          data: !lambda |-
            const int sr = 22050;
            const float freq = 1000.0f;
            const int dur_ms = 300;
            const int n = sr * dur_ms / 1000;
            std::vector<uint8_t> out;
            out.reserve(n * 2);
            for (int i = 0; i < n; i++) {
              float s = sinf(2.0f * 3.1415926f * freq * i / sr);
              int16_t v = (int16_t)(s * 12000);
              out.push_back((uint8_t)(v & 0xFF));
              out.push_back((uint8_t)((v >> 8) & 0xFF));
            }
            return out;
  - platform: template
    name: "Korvo 语音录入"
    id: korvo_ptt
    on_press:
      - voice_assistant.start:
          id: korvo_assistant
  - platform: template
    name: "Start Recording"
    on_press:
      - lambda: |-
          id(korvo_rec).start_recording();
  - platform: template
    name: "Stop Recording"
    on_press:
      - lambda: |-
          id(korvo_rec).stop_recording();

light:
  - platform: esp32_rmt_led_strip
    id: korvo_ring
    name: "Korvo Ring"
    pin: GPIO19
    num_leds: 12
    chipset: WS2812
    rgb_order: GRB

voice_assistant:
  id: korvo_assistant
  microphone: korvo_mic
  speaker: announcement_spk_resampling_input
  auto_gain: 31dBFS
  noise_suppression_level: 3
  use_wake_word: false
  on_start:
    - light.turn_on:
        id: korvo_ring
        brightness: 80%
        red: 0%
        green: 0%
        blue: 100%
    - logger.log: "开始录音并推送到 Home Assistant 管道"
    - lambda: |-
        if (!id(korvo_rec).is_recording()) id(korvo_rec).start_recording();
  on_listening:
    - light.addressable_set:
        id: korvo_ring
        range_from: 0
        range_to: 11
        red: 0%
        green: 100%
        blue: 0%
    - logger.log: "流式语音 -> STT"
  on_stt_end:
    - repeat:
        count: 2
        then:
          - light.addressable_set:
              id: korvo_ring
              range_from: 0
              range_to: 11
              red: 0%
              green: 100%
              blue: 100%
          - delay: 150ms
          - light.turn_off: korvo_ring
          - delay: 150ms
    - logger.log: "Home Assistant STT 返回结果"
  on_error:
    - light.addressable_set:
        id: korvo_ring
        range_from: 0
        range_to: 11
        red: 100%
        green: 0%
        blue: 0%
    - homeassistant.event:
        event: esphome.korvo_voice_error
        data:
          code: !lambda 'return code;'
          message: !lambda 'return message;'
    - logger.log:
        level: ERROR
        format: "Voice assistant error: %s"
        args:
          - message.c_str()
  on_end:
    - light.turn_off:
        id: korvo_ring
        transition_length: 800ms
    - logger.log: "录音完成"
    - lambda: |-
        if (id(korvo_rec).is_recording()) id(korvo_rec).stop_recording();

media_player:
  - platform: speaker
    id: korvo_media
    name: Korvo Media Player
    media_pipeline:
      speaker: media_spk_resampling_input
      num_channels: 1
    announcement_pipeline:
      speaker: announcement_spk_resampling_input
      num_channels: 1

wav_recorder:
  id: korvo_rec
  microphone_id: korvo_mic
  sdcard_id: korvo_sd
  base_path: /sdcard/rec
  max_seconds: 120
