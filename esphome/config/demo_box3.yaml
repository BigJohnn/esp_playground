substitutions:
  name: demo-box3
  friendly_name: Demo Box3
  timezone: Asia/Shanghai

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: "Feature-rich demo for ESP32-S3-BOX-3 with display, touch, sensors, web, and HA API"
  name_add_mac_suffix: true
  project:
    name: esp_playground.demo
    version: "1.0.0"
  on_boot:
    priority: 800
    then:
      # Power up the LCD panel on BOX-3 (active-low power control)
      - output.turn_on: lcd_ctrl
      - logger.log: "Boot: LCD power enabled, initializing components..."
  on_shutdown:
    then:
      - logger.log: "Shutting down..."

external_components:
  - source:
      type: local
      path: custom_components

esp32:
  board: esp32s3box
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  password: !secret api_password

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: false
  reboot_timeout: 5min
  power_save_mode: none
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

web_server:
  port: 80
  auth:
    username: !secret web_user
    password: !secret web_password

time:
  - platform: homeassistant
    id: ha_time
  - platform: sntp
    id: sntp_time
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
    timezone: ${timezone}

i2c:
  - id: i2c_sensors
    sda: 41
    scl: 40
    scan: true
    frequency: 400kHz
  - id: i2c_touch
    sda: 8
    scl: 18
    scan: false

uart:
  - id: uart0
    tx_pin: 43
    rx_pin: 44
    baud_rate: 115200

binary_sensor:
  - platform: status
    name: "${friendly_name} Status"
    id: sys_status
  - platform: gpio
    id: radar_presence
    name: "${friendly_name} Presence"
    device_class: occupancy
    pin:
      number: GPIO21
      mode:
        input: true
        pullup: true
    filters:
      - delayed_off: 120s
  - platform: template
    id: door_opened
    name: "${friendly_name} Door"
    device_class: door

sensor:
  - platform: aht10
    variant: AHT20
    i2c_id: i2c_sensors
    temperature:
      id: temperature
      name: "${friendly_name} Temperature"
      accuracy_decimals: 1
    humidity:
      id: humidity
      name: "${friendly_name} Humidity"
      accuracy_decimals: 0
    update_interval: 10s
  - platform: bh1750
    id: illuminance
    name: "${friendly_name} Illuminance"
    address: 0x23
    i2c_id: i2c_sensors
    update_interval: 15s
  - platform: homeassistant
    id: stock_price
    entity_id: sensor.1024_hk
  - platform: homeassistant
    id: outside_temperature
    entity_id: weather.forecast_home
    attribute: temperature
  - platform: wifi_signal
    name: "${friendly_name} WiFi RSSI"
    id: wifi_rssi
    update_interval: 30s
    filters:
      - sliding_window_moving_average:
          window_size: 10
          send_every: 10
  - platform: uptime
    name: "${friendly_name} Uptime"
    id: uptime_s
    update_interval: 60s
  - platform: template
    name: "${friendly_name} Comfort Index"
    id: comfort_index
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      if (isnan(id(temperature).state) || isnan(id(humidity).state)) return NAN;
      float t = id(temperature).state;
      float rh = id(humidity).state;
      float heat_index = t - (0.55 - 0.0055 * rh) * (t - 14.5);
      return heat_index;

text_sensor:
  - platform: version
    name: "${friendly_name} ESPHome Version"
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP"
    ssid:
      name: "${friendly_name} SSID"
    bssid:
      name: "${friendly_name} BSSID"
    mac_address:
      name: "${friendly_name} MAC"
  - platform: template
    name: "${friendly_name} Uptime (Human)"
    id: uptime_human
    icon: mdi:clock-start
    lambda: |-
      uint32_t seconds = (uint32_t) id(uptime_s).state;
      char buffer[32];
      uint32_t days = seconds / 86400;
      seconds %= 86400;
      uint8_t hours = seconds / 3600;
      seconds %= 3600;
      uint8_t minutes = seconds / 60;
      uint8_t secs = seconds % 60;
      if (days) {
        sprintf(buffer, "%ud %02u:%02u:%02u", days, hours, minutes, secs);
      } else {
        sprintf(buffer, "%02u:%02u:%02u", hours, minutes, secs);
      }
      return std::string(buffer);
  - platform: homeassistant
    id: calendar_event
    entity_id: calendar.personal
  - platform: homeassistant
    id: news_headline
    entity_id: weather.forecast_home

switch:
  - platform: restart
    name: "${friendly_name} Restart"
  - platform: safe_mode
    name: "${friendly_name} Safe Mode"
  - platform: template
    id: demo_switch
    name: "${friendly_name} Demo Switch"
    optimistic: true
    turn_on_action:
      - logger.log: "Demo switch ON"
    turn_off_action:
      - logger.log: "Demo switch OFF"

button:
  - platform: factory_reset
    name: "${friendly_name} Factory Reset"
  - platform: template
    name: "${friendly_name} Ping"
    on_press:
      - logger.log: "Ping!"

number:
  - platform: template
    id: brightness
    name: "${friendly_name} Brightness"
    min_value: 0
    max_value: 1
    step: 0.01
    optimistic: true
    restore_value: true

select:
  - platform: template
    id: mode_select
    name: "${friendly_name} Mode"
    optimistic: true
    options:
      - Auto
      - Manual
      - Away
    initial_option: Auto
    set_action:
      - lambda: |-
          ESP_LOGI("select", "Mode set to %s", x.c_str());

cover:
  - platform: template
    id: demo_cover
    name: "${friendly_name} Virtual Cover"
    optimistic: true
    open_action:
      - logger.log: "Cover open"
    close_action:
      - logger.log: "Cover close"
    stop_action:
      - logger.log: "Cover stop"
    position_action:
      - lambda: |-
          ESP_LOGI("cover", "Cover pos -> %.0f%%", position * 100.0f);
    tilt_action:
      - lambda: |-
          ESP_LOGI("cover", "Tilt -> %.0f%%", tilt * 100.0f);

fan:
  - platform: template
    id: demo_fan
    name: "${friendly_name} Virtual Fan"
    optimistic: true
    on_turn_on:
      - logger.log: "Fan on"
    on_turn_off:
      - logger.log: "Fan off"
    supported_speed_count: 3

globals:
  - id: touch_counter
    type: int
    restore_value: yes
    initial_value: '0'

script:
  - id: notify_touch
    then:
      - globals.set:
          id: touch_counter
          value: !lambda 'return id(touch_counter)+1;'
      - logger.log:
          format: "Touch count: %d"
          args: ["id(touch_counter)"]

touchscreen:
  - platform: gt911
    id: box3_touch
    i2c_id: i2c_touch
    interrupt_pin: GPIO3
    on_touch:
      - lambda: |-
          for (auto &t : touches) {
            ESP_LOGD("touch", "Touch x=%d y=%d state=%d", t.x, t.y, (int)t.state);
          }
      - script.execute: notify_touch

output:
  - platform: gpio
    id: lcd_ctrl
    pin: GPIO47
    inverted: true

display:
  - platform: box3_lcd
    id: my_display
    temperature: temperature
    humidity: humidity
    radar: radar_presence
    stock: stock_price
    calendar: calendar_event
    news: news_headline
    outdoor_temperature: outside_temperature
    time_id: ha_time

