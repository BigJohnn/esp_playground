esphome:
  name: tivoli-ir
  friendly_name: Tivoli IR

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: "okk303kko"
  password: !secret tivoli_wifi_password

# RX and TX verified with Tivoli Power; GPIO21 is held HIGH.
switch:
  - platform: gpio
    pin: GPIO21
    id: ir_power
    internal: true
    restore_mode: ALWAYS_ON

remote_receiver:
  pin:
    number: GPIO14
    inverted: true
  dump: all

remote_transmitter:
  id: ir_tx
  pin: GPIO4
  carrier_duty_percent: 50%
  non_blocking: true


# All commands share NEC address 0x6B86. Captured from the original
# Tivoli Audio remote 2026-09-09..2026-09-10; every command byte pair
# passes the NEC low = ~high checksum.
# The radio distinguishes a short press from a press-and-hold (hold = save the
# current station into a preset). A NEC remote expresses "still held" by
# repeating, so we emulate a hold by re-sending the full frame on the ~108 ms
# NEC frame period. How many frames the radio wants before it calls it a hold is
# a property of its firmware, so hold_frames is a runtime number, not a
# constant: sweeping it is a dial-turn, not a reflash.
number:
  - platform: template
    name: "Hold Frames"
    id: hold_frames
    optimistic: true
    restore_value: true
    initial_value: 18
    min_value: 1
    max_value: 60
    step: 1
    mode: box

script:
  - id: send_ir
    parameters:
      cmd: int
    then:
      - remote_transmitter.transmit_nec:
          address: 0x6B86
          command: !lambda return cmd;
          command_repeats: 1

  # Emulating a press-and-hold. Two earlier attempts failed, both measured:
  #
  #   1. Re-sending the whole NEC frame on the 108 ms period. The radio read
  #      every frame as a separate short press and just recalled the preset over
  #      and over (frame counts 8..45, no save at any of them).
  #   2. Sending NEC "ditto" codes, but as N separate transmit_raw actions in a
  #      repeat loop. Also no save.
  #
  # Capturing the real remote settled it. A short press is one NEC frame plus a
  # single ditto; a press-and-hold is one frame followed by a continuous run of
  # dittos -- about 18 of them over 1.84 s. The ditto measured off the real
  # remote is 9125 us of carrier, 2314 us of silence, then one 526 us mark,
  # which is within a few percent of what attempt 2 sent. So the waveform was
  # never the problem; the delivery was. The transmitter runs non_blocking, so
  # each separate transmit_raw got queued and rescheduled independently and the
  # 108 ms cadence came apart between them -- and cadence is exactly what the
  # radio counts.
  #
  # Hence one single transmission carrying every ditto, built here rather than
  # declared: inside one transmit call the timings are emitted back-to-back with
  # no scheduler in between.
  - id: send_ir_hold
    parameters:
      cmd: int
    then:
      - remote_transmitter.transmit_nec:
          address: 0x6B86
          command: !lambda return cmd;
          command_repeats: 1
      - lambda: |-
          auto call = id(ir_tx).transmit();
          auto *data = call.get_data();
          data->set_carrier_frequency(38000);
          const int n = (int) id(hold_frames).state;
          for (int i = 0; i < n; i++) {
            // 9125 + 2314 + 526 + 96035 = 108000 us, the NEC repeat period
            data->item(9125, 2314);
            data->item(526, 96035);
          }
          call.perform();

