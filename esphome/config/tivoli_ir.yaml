esphome:
  name: tivoli-ir
  friendly_name: Tivoli IR

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: "okk303kko"
  password: !secret tivoli_wifi_password

# RX and TX verified with Tivoli Power; GPIO21 is held HIGH.
switch:
  - platform: gpio
    pin: GPIO21
    id: ir_power
    internal: true
    restore_mode: ALWAYS_ON

remote_receiver:
  pin:
    number: GPIO14
    inverted: true
  dump: all

remote_transmitter:
  pin: GPIO4
  carrier_duty_percent: 50%
  non_blocking: true


# All commands share NEC address 0x6B86. Captured from the original
# Tivoli Audio remote 2026-09-09..2026-09-10; every command byte pair
# passes the NEC low = ~high checksum.
# The radio distinguishes a short press from a press-and-hold (hold = save the
# current station into a preset). A NEC remote expresses "still held" by
# repeating, so we emulate a hold by re-sending the full frame on the ~108 ms
# NEC frame period. How many frames the radio wants before it calls it a hold is
# a property of its firmware, so hold_frames is a runtime number, not a
# constant: sweeping it is a dial-turn, not a reflash.
number:
  - platform: template
    name: "Hold Frames"
    id: hold_frames
    optimistic: true
    restore_value: true
    initial_value: 18
    min_value: 1
    max_value: 60
    step: 1
    mode: box

script:
  - id: send_ir
    parameters:
      cmd: int
    then:
      - remote_transmitter.transmit_nec:
          address: 0x6B86
          command: !lambda return cmd;
          command_repeats: 1

  # Emulating a press-and-hold. The first attempt re-sent the whole NEC frame on
  # the 108 ms period; the radio read every frame as a separate short press and
  # just recalled the preset seven times in a row (measured 2026-09-11, frame
  # counts 8 through 45, no save at any of them). A real remote does not repeat
  # the frame while a key is held -- it sends the frame once and then emits NEC
  # "ditto" codes: a 9 ms mark, a 2.25 ms space, one 560 us mark, and nothing
  # else until the next 108 ms boundary. That is what the radio counts.
  #
  # transmit_raw rather than transmit_nec because ESPHome's NEC action can only
  # repeat the full frame, which is the thing that does not work here. Each raw
  # burst below sums to exactly 108000 us, so consecutive repeats land on the
  # correct period without an extra delay.
  - id: send_ir_hold
    parameters:
      cmd: int
    then:
      - remote_transmitter.transmit_nec:
          address: 0x6B86
          command: !lambda return cmd;
          command_repeats: 1
      - delay: 40ms
      - repeat:
          count: !lambda return (int) id(hold_frames).state;
          then:
            - remote_transmitter.transmit_raw:
                carrier_frequency: 38kHz
                code: [9000, -2250, 560, -96190]

button:
