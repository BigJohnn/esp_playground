esphome:
  name: tivoli-ir
  friendly_name: Tivoli IR

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: "okk303kko"
  password: !secret tivoli_wifi_password

# RX and TX verified with Tivoli Power; GPIO21 is held HIGH.
switch:
  - platform: gpio
    pin: GPIO21
    id: ir_power
    internal: true
    restore_mode: ALWAYS_ON

remote_receiver:
  pin:
    number: GPIO14
    inverted: true
  dump: all

remote_transmitter:
  pin: GPIO4
  carrier_duty_percent: 50%
  non_blocking: true


# All commands share NEC address 0x6B86. Captured from the original
# Tivoli Audio remote 2026-09-09..2026-09-10; every command byte pair
# passes the NEC low = ~high checksum.
script:
  - id: send_ir
    parameters:
      cmd: int
    then:
      - remote_transmitter.transmit_nec:
          address: 0x6B86
          command: !lambda return cmd;
          command_repeats: 1

button:
  - platform: template
    name: "Power"
    id: btn_power
    icon: mdi:power
    on_press:
      - script.execute:
          id: send_ir
          cmd: 0xED12

  - platform: template
    name: "Source"
    id: btn_source
    icon: mdi:import
    on_press:
      - script.execute:
