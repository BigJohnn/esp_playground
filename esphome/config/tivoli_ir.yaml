esphome:
  name: tivoli-ir
  friendly_name: Tivoli IR

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: "okk303kko"
  password: !secret tivoli_wifi_password

# Candidate pinout for the ESP32E-N4 IR board; verify with the real remote.
switch:
  - platform: gpio
    pin: GPIO21
    id: ir_power
    internal: true
    restore_mode: ALWAYS_ON

remote_receiver:
  pin:
    number: GPIO14
    inverted: true
  dump: all

remote_transmitter:
  pin: GPIO4
  carrier_duty_percent: 50%
  non_blocking: true

button:
  - platform: template
    name: "Tivoli Power Test"
    id: tivoli_power_test
    # Four matching captures from the original remote, 2026-09-09.
    on_press:
      - remote_transmitter.transmit_nec:
          address: 0x6B86
          command: 0xED12
          command_repeats: 1
