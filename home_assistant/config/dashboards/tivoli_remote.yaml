        show_state: false
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.tivoli_ir_preset_3
    - type: horizontal-stack
      cards:
      - type: button
        entity: button.tivoli_ir_preset_4
        name: '4'
        icon: mdi:numeric-4-box-outline
        show_state: false
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.tivoli_ir_preset_4
      - type: button
        entity: button.tivoli_ir_preset_5
        name: '5'
        icon: mdi:numeric-5-box-outline
        show_state: false
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.tivoli_ir_preset_5
      - type: button
        entity: button.tivoli_ir_preset_6
        name: '6'
        icon: mdi:numeric-6-box-outline
        show_state: false
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.tivoli_ir_preset_6
